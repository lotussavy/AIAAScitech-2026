[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uam-demand"
dynamic = ["version"]
description = "Generalized-cost and UAM mode-switching analysis for NYC airport taxi trips"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
    "numpy==2.3.4",
    "pandas==2.3.3",
    "matplotlib==3.10.7",
]

[project.scripts]
uam-demand = "uam_demand.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "uam_demand.__version__"}

[tool.setuptools.packages.find]
include = ["uam_demand*"]
